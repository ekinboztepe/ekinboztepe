name: live sigils

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # SIGIL_TOKEN (optional): a read-only token that can see the private repos.
      # Without it, private sigils stay fully lit and only public activity counts.
      - run: node tools/live.mjs
        env:
          GH_TOKEN: ${{ secrets.SIGIL_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md sigils
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh live sigils"
          git pull --rebase
          git push
